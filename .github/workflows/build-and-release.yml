name: Build and Release

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: write

on:
  push:
    branches: [dev]
    tags:
      - '*'

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: >-
      ${{
        fromJSON(
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_CONTROL_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_CONTROL_RUNNER_LABELS_JSON ||
            '["self-hosted","macOS"]'
          ) ||
          '["ubuntu-latest"]'
        )
      }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      control_runner: ${{ steps.set-matrix.outputs.control_runner }}
    env:
      RUNNER_MODE: ${{ vars.BUILD_RUNNER_MODE != '' && vars.BUILD_RUNNER_MODE || 'hosted' }}
      RELEASE_BUILD_PLATFORMS: ${{ vars.RELEASE_BUILD_PLATFORMS != '' && vars.RELEASE_BUILD_PLATFORMS || 'all' }}
      CONTROL_RUNNER: >-
        ${{
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_CONTROL_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_CONTROL_RUNNER_LABELS_JSON ||
            '["self-hosted","macOS"]'
          ) ||
          '["ubuntu-latest"]'
        }}
      MACOS_RUNNER: >-
        ${{
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_MACOS_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_MACOS_RUNNER_LABELS_JSON ||
            '["self-hosted","macOS"]'
          ) ||
          '["macos-14"]'
        }}
      WINDOWS_RUNNER: >-
        ${{
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_WINDOWS_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_WINDOWS_RUNNER_LABELS_JSON ||
            '["self-hosted","Windows"]'
          ) ||
          '["windows-2022"]'
        }}
      LINUX_RUNNER: >-
        ${{
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_LINUX_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_LINUX_RUNNER_LABELS_JSON ||
            '["self-hosted","Linux"]'
          ) ||
          '["ubuntu-latest"]'
        }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          escape_json() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          build_entry() {
            local platform="$1"
            local runner="$2"
            local command="$3"
            local artifact_name="$4"
            local arch="$5"
            local runner_escaped

            runner_escaped=$(escape_json "$runner")

            printf '{"platform":"%s","runner":"%s","command":"%s","artifact-name":"%s","arch":"%s"}' \
              "$platform" \
              "$runner_escaped" \
              "$command" \
              "$artifact_name" \
              "$arch"
          }

          should_include() {
            if [ "$RELEASE_BUILD_PLATFORMS" = "all" ]; then
              return 0
            fi

            local normalized=",$(printf '%s' "$RELEASE_BUILD_PLATFORMS" | tr -d '[:space:]'),"

            case "$normalized" in
              *,"$1",*) return 0 ;;
              *) return 1 ;;
            esac
          }

          entries=()

          if should_include 'macos-arm64'; then
            entries+=("$(build_entry 'macos-arm64' "$MACOS_RUNNER" 'node scripts/build-with-builder.js arm64 --mac --arm64' 'macos-build-arm64' 'arm64')")
          fi

          if should_include 'macos-x64'; then
            entries+=("$(build_entry 'macos-x64' "$MACOS_RUNNER" 'node scripts/build-with-builder.js x64 --mac --x64' 'macos-build-x64' 'x64')")
          fi

          if should_include 'windows-x64'; then
            entries+=("$(build_entry 'windows-x64' "$WINDOWS_RUNNER" 'node scripts/build-with-builder.js x64 --win --x64' 'windows-build-x64' 'x64')")
          fi

          if should_include 'windows-arm64'; then
            entries+=("$(build_entry 'windows-arm64' "$WINDOWS_RUNNER" 'node scripts/build-with-builder.js arm64 --win --arm64' 'windows-build-arm64' 'arm64')")
          fi

          if should_include 'linux'; then
            entries+=("$(build_entry 'linux' "$LINUX_RUNNER" 'bun run dist:linux' 'linux-build' 'x64-arm64')")
          fi

          if [ ${#entries[@]} -eq 0 ]; then
            echo "No build platforms selected. Set RELEASE_BUILD_PLATFORMS to 'all' or a comma-separated subset."
            exit 1
          fi

          MATRIX=$(printf '{"include":[%s]}' "$(IFS=,; echo "${entries[*]}")")

          echo "control_runner=$CONTROL_RUNNER" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Runner mode: $RUNNER_MODE"
          echo "Control runner: $CONTROL_RUNNER"
          echo "Selected platforms: $RELEASE_BUILD_PLATFORMS"
          echo "$MATRIX"

  build-pipeline:
    name: Build Pipeline
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    # dev 分支或正式 tag 触发构建（排除 -dev- tag，避免重复构建）
    if: github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      control_runner: ${{ needs.prepare-matrix.outputs.control_runner }}
    secrets: inherit

  build-android-shell:
    name: Build Android Shell
    needs: prepare-matrix
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')
    runs-on: >-
      ${{
        fromJSON(
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_ANDROID_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_ANDROID_RUNNER_LABELS_JSON ||
            vars.SELF_HOSTED_LINUX_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_LINUX_RUNNER_LABELS_JSON ||
            '["self-hosted","Linux"]'
          ) ||
          '["ubuntu-latest"]'
        )
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve mobile release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Android shell release version: $VERSION"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android signing material
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/contextgo-android-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "Android release signing is configured."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Android release signing is not configured."
          fi

      - name: Build signed Android shell artifacts
        if: steps.signing.outputs.has_signing == 'true'
        shell: bash
        env:
          CONTEXTGO_RELEASE_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash mobile-shell/scripts/build-android-release.sh \
            "${{ steps.version.outputs.version }}" \
            "$RUNNER_TEMP/android-shell-release"

      - name: Upload Android shell artifacts
        if: steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: android-shell-build
          path: ${{ runner.temp }}/android-shell-release/*
          if-no-files-found: error
          retention-days: 7

      - name: Summarize Android release skip
        if: steps.signing.outputs.has_signing != 'true'
        shell: bash
        run: |
          echo "::warning title=Android Shell Release Skipped::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are required for signed APK publishing."
          {
            echo "## Android Shell Release"
            echo ""
            echo "Skipped signed Android shell packaging because release signing secrets are not configured."
            echo ""
            echo "Required secrets:"
            echo "- ANDROID_KEYSTORE_BASE64"
            echo "- ANDROID_KEYSTORE_PASSWORD"
            echo "- ANDROID_KEY_ALIAS"
            echo "- ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_STEP_SUMMARY"

  build-harmony-shell:
    name: Build Harmony Shell
    needs: prepare-matrix
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-') && vars.ENABLE_HARMONY_SHELL_RELEASES == 'true'
    runs-on: >-
      ${{
        fromJSON(
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_HARMONY_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_HARMONY_RUNNER_LABELS_JSON ||
            vars.SELF_HOSTED_MACOS_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_MACOS_RUNNER_LABELS_JSON ||
            '["self-hosted","macOS"]'
          ) ||
          '["macos-14"]'
        )
      }}
    env:
      DEVECO_SDK_HOME: ${{ vars.DEVECO_SDK_HOME != '' && vars.DEVECO_SDK_HOME || '/Users/runner/Library/Huawei/command-line-tools/sdk' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve mobile release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Harmony shell release version: $VERSION"

      - name: Prepare Harmony toolchain
        shell: bash
        run: |
          export PATH="$HOME/Library/Huawei/command-line-tools/bin:$HOME/Library/Huawei/command-line-tools/ohpm/bin:$PATH"
          if ! command -v hvigorw >/dev/null 2>&1; then
            echo "hvigorw is not available on this runner." >&2
            exit 1
          fi
          if ! command -v ohpm >/dev/null 2>&1; then
            echo "ohpm is not available on this runner." >&2
            exit 1
          fi
          echo "Harmony CLI toolchain is available."

      - name: Build Harmony shell artifacts
        shell: bash
        run: |
          export PATH="$HOME/Library/Huawei/command-line-tools/bin:$HOME/Library/Huawei/command-line-tools/ohpm/bin:$PATH"
          cd mobile-shell/harmony
          ohpm install
          hvigorw assembleApp --debug --stacktrace

      - name: Collect signed Harmony artifacts
        id: collect
        shell: bash
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/harmony-shell-release"
          mkdir -p "$OUTPUT_DIR"

          APP_SOURCE="$(find mobile-shell/harmony/build/outputs -type f -name '*.app' ! -name '*unsigned*' | sort | head -n 1 || true)"
          HAP_SOURCE="$(find mobile-shell/harmony/entry/build -type f -name '*.hap' ! -name '*unsigned*' | sort | head -n 1 || true)"

          if [ -n "$APP_SOURCE" ]; then
            cp -f "$APP_SOURCE" "$OUTPUT_DIR/ContextGo-${{ steps.version.outputs.version }}-harmony-universal.app"
          fi

          if [ -n "$HAP_SOURCE" ]; then
            cp -f "$HAP_SOURCE" "$OUTPUT_DIR/ContextGo-${{ steps.version.outputs.version }}-harmony-universal.hap"
          fi

          if find "$OUTPUT_DIR" -maxdepth 1 -type f | grep -q .; then
            echo "has_release_artifacts=true" >> "$GITHUB_OUTPUT"
            find "$OUTPUT_DIR" -maxdepth 1 -type f | sort
          else
            echo "has_release_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Harmony shell artifacts
        if: steps.collect.outputs.has_release_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: harmony-shell-build
          path: ${{ runner.temp }}/harmony-shell-release/*
          if-no-files-found: error
          retention-days: 7

      - name: Summarize Harmony release skip
        if: steps.collect.outputs.has_release_artifacts != 'true'
        shell: bash
        run: |
          echo "::warning title=Harmony Shell Release Skipped::No signed .app / .hap outputs were found. Configure DevEco signing material on the Harmony runner before publishing stable tags."
          {
            echo "## Harmony Shell Release"
            echo ""
            echo "Harmony shell packaging ran, but no signed release outputs were found."
            echo ""
            echo "The runner must provide:"
            echo "- DevEco CLI with hvigorw and ohpm"
            echo "- DEVECO_SDK_HOME"
            echo "- project signing material capable of producing non-unsigned .app / .hap outputs"
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios-shell:
    name: Build iOS Shell
    needs: prepare-matrix
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-') && vars.ENABLE_IOS_SHELL_RELEASES == 'true'
    runs-on: >-
      ${{
        fromJSON(
          vars.BUILD_RUNNER_MODE == 'self-hosted' &&
          (
            vars.SELF_HOSTED_IOS_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_IOS_RUNNER_LABELS_JSON ||
            vars.SELF_HOSTED_MACOS_RUNNER_LABELS_JSON != '' &&
            vars.SELF_HOSTED_MACOS_RUNNER_LABELS_JSON ||
            '["self-hosted","macOS"]'
          ) ||
          '["macos-14"]'
        )
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve mobile release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "iOS shell release version: $VERSION"

      - name: Prepare iOS signing material
        id: signing
        shell: bash
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          if [ -n "$IOS_BUILD_CERTIFICATE_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_BUILD_PROVISION_PROFILE_BASE64" ] && [ -n "$IOS_DEVELOPMENT_TEAM" ]; then
            CERT_PATH="$RUNNER_TEMP/contextgo-ios-build.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/contextgo-ios-build.keychain-db"
            PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_PATH="$PROFILE_DIR/contextgo.mobileprovision"

            mkdir -p "$PROFILE_DIR"
            printf '%s' "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            printf '%s' "$IOS_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

            security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            if [ -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64" ]; then
              EXPORT_OPTIONS_PLIST="$RUNNER_TEMP/ContextGoExportOptions.plist"
              printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$EXPORT_OPTIONS_PLIST"
              echo "export_options_plist=$EXPORT_OPTIONS_PLIST" >> "$GITHUB_OUTPUT"
            fi

            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
            echo "iOS signing material is configured."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing material is not configured."
          fi

      - name: Build signed iOS shell archive
        if: steps.signing.outputs.has_signing == 'true'
        shell: bash
        env:
          CONTEXTGO_RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          CONTEXTGO_IOS_EXPORT_OPTIONS_PLIST: ${{ steps.signing.outputs.export_options_plist }}
        run: |
          if [ -n "$CONTEXTGO_IOS_EXPORT_OPTIONS_PLIST" ]; then
            export CONTEXTGO_IOS_EXPORT_OPTIONS_PLIST
          fi

          bash mobile-shell/scripts/build-ios-release.sh \
            "${{ steps.version.outputs.version }}" \
            "$RUNNER_TEMP/ios-shell-release"

      - name: Upload iOS shell artifacts
        if: steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ios-shell-build
          path: |
            ${{ runner.temp }}/ios-shell-release/ContextGo.xcarchive
            ${{ runner.temp }}/ios-shell-release/*.ipa
            ${{ runner.temp }}/ios-shell-release/export/*
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize iOS release skip
        if: steps.signing.outputs.has_signing != 'true'
        shell: bash
        run: |
          echo "::warning title=iOS Shell Release Skipped::IOS_BUILD_CERTIFICATE_BASE64 / IOS_P12_PASSWORD / IOS_BUILD_PROVISION_PROFILE_BASE64 / IOS_DEVELOPMENT_TEAM are required for signed iOS archive packaging."
          {
            echo "## iOS Shell Release"
            echo ""
            echo "Skipped signed iOS shell packaging because release signing material is not configured."
            echo ""
            echo "Required secrets:"
            echo "- IOS_BUILD_CERTIFICATE_BASE64"
            echo "- IOS_P12_PASSWORD"
            echo "- IOS_BUILD_PROVISION_PROFILE_BASE64"
            echo "- IOS_DEVELOPMENT_TEAM"
            echo ""
            echo "Optional secret:"
            echo "- IOS_EXPORT_OPTIONS_PLIST_BASE64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up iOS signing keychain
        if: steps.signing.outputs.has_signing == 'true' && always()
        shell: bash
        run: |
          if [ -n "${{ steps.signing.outputs.keychain_path }}" ] && [ -f "${{ steps.signing.outputs.keychain_path }}" ]; then
            security delete-keychain "${{ steps.signing.outputs.keychain_path }}"
          fi

  # 自动重试 workflow（当构建失败时）
  auto-retry-workflow:
    name: Auto Retry on Build Failure
    runs-on: ${{ fromJSON(needs.prepare-matrix.outputs.control_runner) }}
    needs: [prepare-matrix, build-pipeline]
    # 关键：只在首次失败时触发，避免无限循环
    if: |
      failure() &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Log retry information
        shell: bash
        run: |
          echo "=========================================="
          echo "🔄 Auto retry triggered (first failure)"
          echo "=========================================="
          echo "Build failed on first attempt, preparing auto retry..."
          echo "Current attempt: ${{ github.run_attempt }}"
          echo "Wait strategy: 5 minutes cooldown before retry"
          echo "=========================================="

      - name: Wait before retry (5 min cooldown)
        shell: bash
        run: |
          echo "⏳ Waiting 5 minutes before retry..."
          echo "Start: $(date)"
          sleep 300
          echo "End: $(date)"
          echo "Triggering retry..."

      - name: Trigger workflow rerun
        shell: bash
        run: |
          echo "🔄 Triggering full workflow rerun (attempt 2)..."

          # Use re-run API (not rerun-failed-jobs, to avoid loops)
          response=$(curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -w "\n%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun)

          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" = "201" ]; then
            echo ""
            echo "✅ Retry triggered successfully"
            echo "This will be attempt 2"
            echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo ""
            echo "❌ Retry trigger failed, HTTP status: $http_code"
            echo "Response:"
            echo "$response" | head -n-1
            exit 1
          fi

  # 自动创建tag（仅 dev 分支推送时）
  create-tag:
    name: Create Tag from Branch
    runs-on: ${{ fromJSON(needs.prepare-matrix.outputs.control_runner) }}
    needs: [prepare-matrix, build-pipeline]
    if: success() && github.ref == 'refs/heads/dev'
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
      is_dev: ${{ steps.create_tag.outputs.is_dev }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create and push tag
        id: create_tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # 根据分支确定 tag 格式
          if [ "$BRANCH_NAME" = "dev" ]; then
            TAG_NAME="v${VERSION}-dev-${COMMIT_SHORT}"
            IS_DEV="true"
            echo "🔧 Development release: $TAG_NAME"
          else
            TAG_NAME="v$VERSION"
            IS_DEV="false"
            echo "🚀 Production release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

          # 检查远程tag是否已存在
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            if [ "$IS_DEV" = "false" ]; then
              # Main 分支：需要递增版本并修改 package.json
              echo "⚠️ Tag $TAG_NAME already exists, auto-incrementing version..."

              if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR=${BASH_REMATCH[1]}
                MINOR=${BASH_REMATCH[2]}
                PATCH=${BASH_REMATCH[3]}
                NEW_PATCH=$((PATCH + 1))
                NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

                echo "📝 Updating package.json version to $NEW_VERSION"

                # 更新 package.json 版本号
                bun pm version $NEW_VERSION

                # 配置git用户信息
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                # 提交版本更新
                git add package.json bun.lock
                git commit -m "chore: bump version to $NEW_VERSION"
                git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN || github.token }}@github.com/${{ github.repository }}.git
                git push origin $BRANCH_NAME

                # 获取新的 commit ID
                COMMIT_SHORT=$(git rev-parse --short HEAD)
                TAG_NAME="v${NEW_VERSION}-${COMMIT_SHORT}"

                echo "🚀 New tag with updated version: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              else
                TAG_NAME="v${VERSION}-${COMMIT_SHORT}"
                echo "⚠️ Fallback: creating tag with commit ID: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              fi
            else
              # Dev 分支 tag 已存在则失败（不应该发生）
              echo "⚠️ Dev tag $TAG_NAME already exists, this shouldn't happen"
              exit 1
            fi
          fi

          # 配置git用户信息（如果前面没配置）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 创建并推送tag
          echo "Creating tag: $TAG_NAME"
          git tag $TAG_NAME
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN || github.token }}@github.com/${{ github.repository }}.git
          git push origin $TAG_NAME
          echo "✅ Successfully created and pushed tag: $TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

  # 发布到 GitHub Releases
  release:
    name: Create Release
    runs-on: ${{ fromJSON(needs.prepare-matrix.outputs.control_runner) }}
    needs: [prepare-matrix, build-pipeline, build-android-shell, build-harmony-shell, build-ios-shell, create-tag]
    # Tag 推送时 create-tag 会被跳过，所以需要检查两种情况（排除 -dev- tag 避免重复）
    if: >-
      always() &&
      needs.build-pipeline.result == 'success' &&
      (needs.build-android-shell.result == 'success' || needs.build-android-shell.result == 'skipped') &&
      (needs.build-harmony-shell.result == 'success' || needs.build-harmony-shell.result == 'skipped') &&
      (needs.build-ios-shell.result == 'success' || needs.build-ios-shell.result == 'skipped') &&
      (needs.create-tag.result == 'success' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')))
    # dev 分支使用 dev-release 环境，正式 tag 使用 release 环境
    environment: ${{ needs.create-tag.outputs.is_dev == 'true' && 'dev-release' || 'release' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version for release
        id: version
        shell: bash
        run: |
          # 判断触发来源：正式 tag 推送 or dev 分支
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 正式 Tag 推送触发（-dev- tag 已被排除，不会到达这里）
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_DEV="false"
            echo "🚀 Creating stable release from tag: $TAG_NAME"
          else
            # dev 分支触发，使用 create-tag job 的输出
            TAG_NAME="${{ needs.create-tag.outputs.tag_name }}"
            IS_DEV="${{ needs.create-tag.outputs.is_dev }}"
            echo "🔧 Creating development release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets (normalize updater metadata)
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Verify release assets
        shell: bash
        run: bash scripts/verify-release-assets.sh release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_dev == 'true' && format('Development Build {0}', steps.version.outputs.tag_name) || steps.version.outputs.tag_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.apk
            release-assets/**/*.aab
            release-assets/**/*.hap
            release-assets/**/*.app
            release-assets/**/*.zip
            release-assets/**/*.json
            release-assets/**/*.yml
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.version.outputs.is_dev == 'true' || contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'rc') }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
