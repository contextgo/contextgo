name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref, branch, tag, or SHA to build'
        required: false
        default: 'main'
        type: string
      use_hosted_runner:
        description: 'Force GitHub-hosted macOS runner for this manual run'
        required: false
        default: false
        type: boolean
      hosted_runner_label:
        description: 'GitHub-hosted macOS label when use_hosted_runner is true'
        required: false
        default: 'macos-15'
        type: string
  workflow_run:
    workflows:
      - Build and Release
    types:
      - completed

concurrency:
  group: ios-testflight-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload-testflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (vars.ENABLE_IOS_TESTFLIGHT_RELEASES == 'true' || vars.ENABLE_IOS_SHELL_RELEASES == 'true')
      )
    uses: ./.github/workflows/_ios-testflight-reusable.yml
    with:
      source_ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      require_release_tag: ${{ github.event_name == 'workflow_run' }}
      use_hosted_runner: ${{ github.event_name == 'workflow_dispatch' && inputs.use_hosted_runner || false }}
      hosted_runner_label: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_runner_label || 'macos-15' }}
    secrets: inherit
