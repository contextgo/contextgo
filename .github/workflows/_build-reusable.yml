name: Build Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'Build matrix as JSON string (passed via fromJSON in caller)'
        type: string
        required: true
      ref:
        description: 'Git ref to checkout (leave empty to use the triggering commit)'
        type: string
        default: ''
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        type: boolean
        default: false
      control_runner:
        description: 'Runner labels as a JSON array for control-plane jobs such as code quality and summaries'
        type: string
        default: '["ubuntu-latest"]'
      append_commit_hash:
        description: 'Append short commit hash to artifact names'
        type: boolean
        default: false
      upload_installers_only:
        description: 'Only upload primary installers (exe/msi/dmg/deb), skip zip/yml/blockmap'
        type: boolean
        default: false
      release_repository:
        description: 'Public GitHub repository used as the distribution source of truth'
        type: string
        default: 'contextgo/contextgo-releases'

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ${{ fromJSON(inputs.control_runner) }}
    if: ${{ !inputs.skip_code_quality }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bunx oxlint --quiet

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    needs: code-quality
    if: ${{ always() && (inputs.skip_code_quality || needs.code-quality.result == 'success') }}

    outputs:
      commit-short: ${{ steps.commit.outputs.short }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Download source archive (Windows self-hosted)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          ARCHIVE_REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          $workspace = $env:GITHUB_WORKSPACE
          $archive = Join-Path $env:RUNNER_TEMP 'contextgo-source.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'contextgo-source'
          $archiveUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/zipball/$env:ARCHIVE_REF"

          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          Get-ChildItem -LiteralPath $workspace -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          curl.exe --fail --show-error --silent --location --http1.1 `
            --retry 8 `
            --retry-all-errors `
            --retry-delay 5 `
            --connect-timeout 20 `
            --max-time 900 `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            $archiveUrl `
            -o $archive

          tar -xf $archive -C $extractDir

          $sourceDir = Get-ChildItem -LiteralPath $extractDir -Directory | Select-Object -First 1
          if (-not $sourceDir) {
            Write-Error 'Failed to unpack source archive'
          }

          Get-ChildItem -LiteralPath $sourceDir.FullName -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $workspace -Recurse -Force
          }

      - name: Checkout source
        if: runner.environment != 'self-hosted' || runner.os != 'Windows'
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT="${GITHUB_SHA::7}"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Commit: ${SHORT}"

      - name: Resolve release repository
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
        run: |
          set -euo pipefail

          OWNER="${RELEASE_REPOSITORY%%/*}"
          REPO="${RELEASE_REPOSITORY#*/}"

          if [ -z "${OWNER}" ] || [ -z "${REPO}" ] || [ "${OWNER}" = "${REPO}" ]; then
            echo "::error::Invalid release repository: ${RELEASE_REPOSITORY}"
            exit 1
          fi

          echo "CONTEXTGO_RELEASE_REPO=${OWNER}/${REPO}" >> "${GITHUB_ENV}"
          echo "CONTEXTGO_RELEASE_OWNER=${OWNER}" >> "${GITHUB_ENV}"
          echo "CONTEXTGO_RELEASE_NAME=${REPO}" >> "${GITHUB_ENV}"

      - name: Detect preinstalled bun
        id: preinstalled_bun
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail

          if command -v bun >/dev/null 2>&1; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "path=$(command -v bun)" >> "${GITHUB_OUTPUT}"
            echo "Using preinstalled bun: $(command -v bun)"
            bun --revision || bun --version
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "No preinstalled bun found on self-hosted runner."
          fi

      - name: Setup bun
        if: runner.environment != 'self-hosted' || steps.preinstalled_bun.outputs.available != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare Python tool cache
        if: runner.environment != 'self-hosted' || runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hostedtoolcache"

      - name: Setup Python
        if: runner.environment != 'self-hosted' || runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          # Hosted runners and Windows self-hosted runners can use setup-python.
          python-version: '3.11'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/hostedtoolcache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/hostedtoolcache

      - name: Use system Python (self-hosted Unix)
        if: runner.environment == 'self-hosted' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python3 || true)"
          if [ -z "${PYTHON_BIN}" ]; then
            PYTHON_BIN="$(command -v python || true)"
          fi
          if [ -z "${PYTHON_BIN}" ]; then
            echo "::error::Neither python3 nor python is available on this self-hosted runner."
            exit 1
          fi
          echo "PYTHON=${PYTHON_BIN}" >> "${GITHUB_ENV}"
          echo "Using system Python: ${PYTHON_BIN}"
          "${PYTHON_BIN}" --version

      # Restore Electron/Electron-Builder caches before any build-related install
      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: Cache status
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: Configure Electron cache environment
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_CACHE_ROOT="${RUNNER_TEMP}/.cache/electron"
          ELECTRON_BUILDER_CACHE_ROOT="${RUNNER_TEMP}/.cache/electron-builder"
          mkdir -p "${ELECTRON_CACHE_ROOT}" "${ELECTRON_BUILDER_CACHE_ROOT}"

          {
            echo "ELECTRON_CACHE=${ELECTRON_CACHE_ROOT}"
            echo "ELECTRON_BUILDER_CACHE=${ELECTRON_BUILDER_CACHE_ROOT}"
            echo "electron_config_cache=${ELECTRON_CACHE_ROOT}"
            echo "npm_config_electron_config_cache=${ELECTRON_CACHE_ROOT}"
          } >> "${GITHUB_ENV}"

      - name: Prewarm Electron binary cache (Linux self-hosted)
        if: matrix.platform == 'linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_VERSION="$(node - <<'NODE'
          const fs = require('fs');
          const lock = fs.readFileSync('bun.lock', 'utf8');
          const match = lock.match(/"electron": \["electron@([^"]+)"/);
          if (!match) {
            throw new Error('Unable to resolve electron version from bun.lock');
          }
          process.stdout.write(match[1]);
          NODE
          )"

          ELECTRON_URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-linux-x64.zip"
          ELECTRON_FILE="electron-v${ELECTRON_VERSION}-linux-x64.zip"
          CACHE_BUCKET="$(node - "${ELECTRON_URL}" <<'NODE'
          const crypto = require('crypto');
          const { URL } = require('url');

          const parsed = new URL(process.argv[2]);
          parsed.hash = '';
          parsed.search = '';
          parsed.pathname = parsed.pathname.substring(0, parsed.pathname.lastIndexOf('/'));

          process.stdout.write(
            crypto.createHash('sha256').update(parsed.toString()).digest('hex'),
          );
          NODE
          )"

          TARGET_DIR="${ELECTRON_CACHE}/${CACHE_BUCKET}"
          TARGET_FILE="${TARGET_DIR}/${ELECTRON_FILE}"
          TARGET_PART="${TARGET_FILE}.part"
          mkdir -p "${TARGET_DIR}"

          if [ -s "${TARGET_FILE}" ]; then
            echo "Electron cache hit: ${TARGET_FILE}"
            exit 0
          fi

          echo "Prewarming Electron cache: ${ELECTRON_URL}"
          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 3600 \
            --continue-at - \
            --output "${TARGET_PART}" \
            "${ELECTRON_URL}"

          mv -f "${TARGET_PART}" "${TARGET_FILE}"
          ls -lh "${TARGET_FILE}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          attempts=3
          delay=30
          for attempt in $(seq 1 "${attempts}"); do
            if bun install --no-frozen-lockfile; then
              exit 0
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then
              echo "::error::bun install failed after ${attempts} attempts."
              exit 1
            fi
            echo "bun install failed on attempt ${attempt}/${attempts}; retrying in ${delay}s..."
            sleep "${delay}"
          done

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Setup Windows native dependencies (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        run: |
          bun install --global node-gyp

      - name: Install MSVC ARM64 toolchain (Windows ARM64 only)
        if: matrix.platform == 'windows-arm64'
        continue-on-error: true
        shell: pwsh
        run: |
          $attempts = 3
          $delaySeconds = 60
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            choco install visualstudio2022buildtools --yes --params "'--add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --includeOptional'"
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq $attempts) {
              Write-Warning "MSVC ARM64 toolchain install failed after $attempts attempts."
              exit $LASTEXITCODE
            }
            Write-Warning "MSVC ARM64 toolchain install failed on attempt $attempt/$attempts; retrying in $delaySeconds seconds..."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Setup Windows build environment (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        run: |
          echo "Setting Windows SDK version for ConPty support"
          echo "WindowsTargetPlatformVersion=10.0.19041.0" >> $env:GITHUB_ENV

      - name: Setup MSBuild (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron
        if: "!startsWith(matrix.platform, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Print build configuration
        run: |
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Platform: ${{ matrix.platform }}"
          echo "Target Architecture: ${{ matrix.arch }}"
          echo "Build Command: ${{ matrix.command }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Ref: ${{ inputs.ref || '(default)' }}"
          echo "Commit: ${{ steps.commit.outputs.short }}"
          echo "=========================================="

      # macOS code signing certificate installation
      - name: Setup macOS code signing (macOS only)
        if: startsWith(matrix.platform, 'macos')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="${RUNNER_TEMP}/contextgo-build.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/contextgo-build-certificate.p12"

          if [ -n "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "Installing code signing certificate..."

            rm -f "${CERTIFICATE_PATH}"
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true

            # Create certificate file
            printf '%s' "${BUILD_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"

            # Create temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" "${KEYCHAIN_PATH}"
            LOGIN_KEYCHAIN_PATH="${HOME}/Library/Keychains/login.keychain-db"
            security list-keychains -d user -s "${KEYCHAIN_PATH}" "${LOGIN_KEYCHAIN_PATH}"
            security default-keychain -s "${KEYCHAIN_PATH}"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"

            # Import certificate
            security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "${KEYCHAIN_PATH}"
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

            # Clean up certificate file
            rm -f "${CERTIFICATE_PATH}"

            echo "Certificate imported successfully"
          else
            echo "No certificate provided - building unsigned application"
            echo "To enable code signing, add BUILD_CERTIFICATE_BASE64 and P12_PASSWORD secrets"
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_PACKAGES=(
            build-essential
            python3
            python3-pip
            pkg-config
            libsqlite3-dev
            fakeroot
            dpkg-dev
            rpm
            libnss3-dev
            libatk-bridge2.0-dev
            libdrm2
            libxkbcommon-dev
            libxss1
            libatspi2.0-dev
            libgtk-3-dev
            libxrandr2
            libasound2-dev
          )

          missing_packages=()
          for pkg in "${REQUIRED_PACKAGES[@]}"; do
            if ! dpkg -s "${pkg}" >/dev/null 2>&1; then
              missing_packages+=("${pkg}")
            fi
          done

          if [ "${#missing_packages[@]}" -eq 0 ]; then
            echo "Linux build dependencies already installed on runner."
            exit 0
          fi

          echo "Missing Linux packages: ${missing_packages[*]}"

          if ! sudo -n true >/dev/null 2>&1; then
            echo "::error::Self-hosted Linux runner is missing required packages but does not allow passwordless sudo: ${missing_packages[*]}"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y "${missing_packages[@]}"

      - name: Rebuild native modules for Electron (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        continue-on-error: false
        run: |
          $arch = "${{ matrix.arch }}"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()

          Write-Host "=========================================="
          Write-Host "Rebuilding native modules for Electron $electronVer ($arch)"
          Write-Host "=========================================="

          # Strategy: Try prebuild-install first (faster, more reliable)
          # Fallback to electron-rebuild only if prebuild-install fails
          $success = $false

          # Step 1: Try prebuild-install (downloads prebuilt binaries)
          Write-Host ""
          Write-Host "[Step 1] Trying prebuild-install..."
          $prebuildResult = $null
          try {
          $prebuildResult = bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=$arch --force 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ prebuild-install succeeded"
              $success = $true
            } else {
              Write-Host "⚠️ prebuild-install exited with code $LASTEXITCODE"
            }
          } catch {
            Write-Host "⚠️ prebuild-install failed: $_"
          }

          # Step 2: Verify or fallback to electron-rebuild
          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $sqliteNode)) {
            Write-Host ""
            Write-Host "[Step 2] prebuild-install didn't produce binary, trying electron-rebuild..."
            try {
              bunx electron-rebuild -f -w better-sqlite3
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ electron-rebuild succeeded"
                $success = $true
              }
            } catch {
              Write-Host "❌ electron-rebuild failed: $_"
            }
          }

          # Final verification
          Write-Host ""
          Write-Host "Verifying native modules..."
          if (Test-Path $sqliteNode) {
            $size = [math]::Round((Get-Item $sqliteNode).Length / 1MB, 1)
            Write-Host "✅ better-sqlite3 found: $sqliteNode ($size MB)"
          } else {
            Write-Error "❌ better-sqlite3 native module not found at: $sqliteNode"
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "✅ All critical native modules verified"
          Write-Host "=========================================="
          exit 0
        env:
          npm_config_runtime: electron
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_disturl: https://electronjs.org/headers
          # Don't force build_from_source - let prebuild-install try first
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Build with electron-builder (Windows)
        if: startsWith(matrix.platform, 'windows')
        id: windows-build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = $env:WINDOWS_BUILD_COMMAND
          $BuildFailed = $false

          try {
            Write-Host "Running Windows build command: $Command"
            iex $Command
            Write-Host "Windows build completed successfully"
          } catch {
            $BuildFailed = $true
            Write-Warning "${{ matrix.platform }} build failed but will not block the workflow"
            Write-Host "::notice title=Windows build skipped::${{ matrix.platform }} build failed (see logs above) but workflow is allowed to continue."
          }

          if ($BuildFailed) {
            "result=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "result=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        env:
          WINDOWS_BUILD_COMMAND: ${{ matrix.command }}
          # Node.js memory limit for vite bundling (prevents OOM during build)
          # Node.js 内存限制，防止 vite 打包时内存不足
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Target arch / 目标架构
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          # Native module compilation / 原生模块编译
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          # Signing & IDs / 签名与应用 ID 配置
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Windows build flags / Windows 构建参数
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          _WIN32_WINNT: 0x0A00
          # Sentry DSN (injected at build time via vite define)
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # CI flag & GitHub token / CI 标识与 GitHub Token
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      # Clean up any stale disk images before DMG creation (macOS only)
      # 清理可能残留的磁盘镜像，避免 hdiutil "Device not configured" 错误
      - name: Clean up stale disk images (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Cleaning up any stale disk images..."
          # Detach any mounted disk images
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            echo "Detaching $disk..."
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          # Clean up any temporary DMG files
          rm -f /tmp/*.dmg 2>/dev/null || true
          echo "Cleanup complete"

      # macOS: Build with notarization - DMG failure = CI failure, notarization failure = CI failure
      # macOS: 构建并公证 - DMG 失败 = CI 失败，公证失败 = CI 失败
      - name: Build with electron-builder (macOS)
        if: startsWith(matrix.platform, 'macos')
        id: macos-build
        shell: bash
        run: |
          set +e  # Handle errors manually

          # Run build command
          ${{ matrix.command }} 2>&1 | tee "${RUNNER_TEMP}/build.log"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          # Check if DMG was created (most important artifact)
          DMG_EXISTS=false
          if ls out/*.dmg 1>/dev/null 2>&1; then
            DMG_EXISTS=true
            echo "✅ DMG created successfully"
          fi

          # If build succeeded completely
          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build completed successfully"
            echo "notarization_status=success" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build failed - surface notarization failures as release blockers
          if [ "$DMG_EXISTS" = true ]; then
            if grep -qiE "notariz|staple" "${RUNNER_TEMP}/build.log"; then
              echo "❌ DMG created but notarization failed"
              echo "notarization_status=failed" >> $GITHUB_OUTPUT
              echo "::error title=Notarization Failed::DMG was built and signed successfully, but notarization failed."
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "## ❌ Notarization Failed" >> $GITHUB_STEP_SUMMARY
              echo "DMG was built and signed successfully, but **notarization failed**." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "This release is blocked until notarization succeeds." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi

          # DMG doesn't exist or other fatal error - fail CI
          echo "❌ Build failed - DMG was not created"
          echo "notarization_status=build_failed" >> $GITHUB_OUTPUT
          exit 1
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      # Linux: Standard build without special error handling
      # Linux: 标准构建，无特殊错误处理
      - name: Build with electron-builder (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          attempts=2
          delay=60
          for attempt in $(seq 1 "${attempts}"); do
            if ${{ matrix.command }}; then
              exit 0
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then
              echo "::error::Linux build command failed after ${attempts} attempts."
              exit 1
            fi
            echo "Linux build command failed on attempt ${attempt}/${attempts}; retrying in ${delay}s..."
            sleep "${delay}"
          done
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify packaged bundled bun assets
        if: >-
          !startsWith(matrix.platform, 'windows') ||
          steps.windows-build.outputs.result == 'success'
        run: bun run test:packaged:bun

      # macOS 钥匙串清理
      - name: Clean up keychain (macOS only)
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/contextgo-build.keychain-db"
          if [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}"
            echo "Temporary keychain deleted"
          fi

      # macOS 构建失败通知
      # macOS build failure notification
      - name: Notify on macOS build failure
        if: startsWith(matrix.platform, 'macos') && failure()
        run: |
          echo "::error title=macOS Build Failed::Build failed. Check the logs for details."
          echo ""
          echo "❌ macOS Build Failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Common causes:"
          echo "  • hdiutil/DMG creation failure (Device not configured)"
          echo "  • Code signing issues"
          echo "  • Notarization timeout"
          echo "  • Out of memory (OOM)"
          echo ""
          echo "Check the build logs above for the specific error."
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: List build artifacts (non-Windows)
        if: (success() || failure()) && !startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD ARTIFACTS"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
            echo "=========================================="
            echo "Total artifacts:"
            find out/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.yml" \) -exec basename {} \; || true
          else
            echo "No out directory found!"
          fi

      - name: List build artifacts (Windows)
        if: (success() || failure()) && startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD ARTIFACTS"
          Write-Host "=========================================="
          if (Test-Path 'out') {
            Get-ChildItem -Path out | Format-Table Name, Length, LastWriteTime -AutoSize
            Write-Host "=========================================="
            Write-Host "Total artifacts:"
            Get-ChildItem -Path out -File | Where-Object {
              $_.Extension -in '.exe', '.msi', '.dmg', '.deb', '.zip', '.yml'
            } | Select-Object -ExpandProperty Name
          } else {
            Write-Host 'No out directory found!'
          }

      # Upload artifacts when:
      # - Build succeeded (all platforms)
      # - macOS: notarization timeout but artifacts exist (handled in build step)
      # - Windows: only if windows-build step succeeded
      # 上传产物条件：
      # - 构建成功（所有平台）
      # - macOS: 公证超时但有产物（已在构建步骤中处理）
      # - Windows: 仅当 windows-build 步骤成功
      - name: Clean up non-installer artifacts (non-Windows)
        if: inputs.upload_installers_only && success() && !startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          echo "Removing non-installer files from out/ ..."
          rm -f out/*.blockmap out/*.zip out/*.yml out/builder-debug.yml 2>/dev/null || true
          echo "Remaining artifacts:"
          ls -lh out/ || true

      - name: Clean up non-installer artifacts (Windows)
        if: >-
          inputs.upload_installers_only && success() &&
          startsWith(matrix.platform, 'windows') &&
          steps.windows-build.outputs.result == 'success'
        shell: pwsh
        run: |
          Write-Host 'Removing non-installer files from out\ ...'
          $patterns = @('*.blockmap', '*.zip', '*.yml', 'builder-debug.yml')
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path out -Filter $pattern -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'Remaining artifacts:'
          Get-ChildItem -Path out -ErrorAction SilentlyContinue

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: >-
          success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        with:
          name: ${{ inputs.append_commit_hash && format('{0}-{1}', matrix.artifact-name, steps.commit.outputs.short) || matrix.artifact-name }}
          compression-level: 0
          path: |
            out/*.exe
            out/*.msi
            out/*.dmg
            out/*.deb
            out/ContextGo-*-win-*.zip
            out/ContextGo-*-windows-*.zip
            out/ContextGo-*-mac-*.zip
            out/ContextGo-*-macos-*.zip
            out/*.yml
          if-no-files-found: warn
          retention-days: 7

      - name: Prune self-hosted runner caches (non-Windows)
        if: runner.environment == 'self-hosted' && always() && !startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set +e

          prune_children() {
            local dir="$1"
            local days="$2"
            if [ -d "${dir}" ]; then
              find "${dir}" -mindepth 1 -maxdepth 1 -mtime "+${days}" -exec rm -rf {} +
            fi
          }

          prune_children "${RUNNER_TEMP}/.cache/electron" 14
          prune_children "${RUNNER_TEMP}/.cache/electron-builder" 14
          prune_children "${HOME}/.cache/electron" 14
          prune_children "${HOME}/.cache/electron-builder" 14

          find "${RUNNER_TEMP}" -maxdepth 1 \
            \( -name 'contextgo-*' -o -name 'contextgo-source*' -o -name '*.p12' -o -name '*.mobileprovision*' \) \
            -mtime +2 -exec rm -rf {} +

      - name: Prune self-hosted runner caches (Windows)
        if: runner.environment == 'self-hosted' && always() && startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $targets = @(
            (Join-Path $env:RUNNER_TEMP '.cache\electron'),
            (Join-Path $env:RUNNER_TEMP '.cache\electron-builder'),
            (Join-Path $env:LOCALAPPDATA 'electron-builder\Cache')
          )

          foreach ($target in $targets) {
            if (Test-Path $target) {
              Get-ChildItem -Path $target -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-14) } |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Get-ChildItem -Path $env:RUNNER_TEMP -Force -ErrorAction SilentlyContinue |
            Where-Object {
              $_.LastWriteTime -lt (Get-Date).AddDays(-2) -and
              ($_.Name -like 'contextgo-*' -or $_.Name -like 'contextgo-source*' -or $_.Name -like '*.p12')
            } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

  build-summary:
    name: Build Summary
    runs-on: ${{ fromJSON(inputs.control_runner) }}
    needs: [code-quality, build]
    if: always()

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Write build summary
        env:
          MATRIX: ${{ inputs.matrix }}
          REF_NAME: ${{ inputs.ref || '(default)' }}
          COMMIT_SHORT: ${{ needs.build.outputs.commit-short }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: >-
          node -e 'const { appendFileSync } = require("node:fs"); const matrix
          = JSON.parse(process.env.MATRIX); const platforms = (matrix.include ??
          []).map((entry) => entry.platform).join(", "); const lines = ["##
          Build Summary", "", "| Key | Value |", "|-----|-------|", `| Ref |
          \`${process.env.REF_NAME}\` |`, `| Commit |
          \`${process.env.COMMIT_SHORT}\` |`, `| Platforms | ${platforms} |`,
          `| Code Quality | ${process.env.CODE_QUALITY_RESULT} |`, `| Build |
          ${process.env.BUILD_RESULT} |`];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
          `${lines.join("\n")}\n`);'
